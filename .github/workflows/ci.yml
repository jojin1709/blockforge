name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - name: Cargo check
        run: cargo check

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/Blockforge/assets/character | Out-Null
          Copy-Item target/release/blockforge.exe out/Blockforge/Blockforge.exe
          Copy-Item assets/character/skin.png out/Blockforge/assets/character/skin.png
          Copy-Item README.md out/Blockforge/README.md
          Copy-Item LICENSE out/Blockforge/LICENSE
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blockforge-windows
          path: out/Blockforge
          retention-days: 14

  release:
    name: Release
    runs-on: windows-latest
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Blockforge-windows
          path: Blockforge
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path Blockforge -DestinationPath Blockforge-windows.zip
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: Blockforge-windows.zip
          generate_release_notes: true
